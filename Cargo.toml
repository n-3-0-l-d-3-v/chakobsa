[workspace]
resolver = "2"
members = [
    "crates/lexer",
    "crates/ir",
    "crates/parser",
    "crates/codegen",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "1"
proptest = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
